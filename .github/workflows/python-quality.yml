name: Python Quality

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Syntax check (compile every module)
      run: python -m compileall -q src test

    - name: Install ruff
      run: pip install 'ruff==0.17.4'

    # F = pyflakes (unused imports, undefined names, redefinitions, unused
    # vars); E9 = runtime/syntax errors. Scoped to real defects so the gate
    # is green on the current codebase.
    - name: Lint (ruff F,E9)
      run: ruff check --select F,E9 src test

  python-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install -r src/requirements.txt

    # The import tests (test_e2e.py:312) hard-require pandoc for docx/html/md
    # -> RST. Pin the SAME version the production image ships (Debian trixie's
    # pandoc 3.1.x): pandoc 3.7+ emits ".. figure::" instead of pandoc's
    # "|name|" substitution form for docx images, which changes what the
    # importer's def-dispatch tests assert against. The static binary from the
    # pandoc releases is version-stable, unlike `apt-get install pandoc`
    # (ubuntu-latest already moved to Ubuntu 26 / pandoc 3.7.0.2).
    - name: Install pandoc (pinned to match the production image)
      run: |
        set -e
        PANDOC_VERSION=3.1.11
        curl -fsSL https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz \
          | tar xz --strip-components=2 -C /usr/local/bin pandoc-${PANDOC_VERSION}/bin/pandoc
        pandoc --version | head -1

    # Hermetic end-to-end suite: RST preview, clone (local bare repo + mock
    # API), edit/commit/push, PR, import, file CRUD.
    - name: Run e2e suite
      working-directory: test
      run: python test_e2e.py

    - name: Run reaper unit test (idle work-dir cleanup)
      working-directory: test
      run: python test_reaper.py

    # Grid-table alignment after image-substitution renaming (docutils-based).
    - name: Run grid-table unit test
      working-directory: test
      run: python test_grid_tables.py

    - name: Run JS suites (url parse / tables / tree)
      run: |
        node test/test_url_parse.js
        node test/test_table.js
        node test/test_tree.js
